<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Hệ Thống Học Video 30 Ngày (YouTube Player)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --accent-green: #10b981;
            --accent-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            padding: 24px;
            /* Hỗ trợ notch/safe-area trên iPhone */
            padding-top: max(24px, env(safe-area-inset-top));
            padding-bottom: max(24px, env(safe-area-inset-bottom));
            padding-left: max(16px, env(safe-area-inset-left));
            padding-right: max(16px, env(safe-area-inset-right));
        }

        header {
            max-width: 1400px;
            margin: 0 auto 28px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        h1 {
            font-size: clamp(1.3rem, 4vw, 1.8rem);
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            touch-action: manipulation;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }

        .btn-outline:hover {
            background-color: var(--card-bg);
            color: var(--text-light);
        }

        /* Responsive Grid 30 Ngày */
        .days-grid {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        @media (max-width: 1200px) {
            .days-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 850px) {
            .days-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
            body { padding: 16px; }
        }
        @media (max-width: 550px) {
            .days-grid { grid-template-columns: 1fr; gap: 12px; }
        }

        .day-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .day-title {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-light);
        }

        .day-badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            background-color: rgba(16, 185, 129, 0.2);
            color: var(--accent-green);
            font-weight: 600;
        }

        .video-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        @media (max-width: 360px) {
            .video-list { grid-template-columns: 1fr; }
        }

        .video-item {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }

        .video-item.unlocked:hover, .video-item.unlocked:active {
            border-color: var(--primary);
            transform: translateY(-2px);
            background-color: rgba(79, 70, 229, 0.15);
        }

        .video-title {
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .video-status {
            font-size: 0.75rem;
            color: var(--accent-green);
        }

        /* Modal Base Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            padding: 16px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: var(--card-bg);
            border-radius: 16px;
            width: 100%;
            max-width: 550px;
            padding: 24px;
            border: 1px solid var(--border-color);
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        /* Modal Video Container */
        .modal-video-content {
            background-color: var(--card-bg);
            border-radius: 16px;
            width: 100%;
            max-width: 960px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            max-height: 95vh;
        }

        /* Thanh tiêu đề Modal chứa Nút Đóng tách biệt */
        .modal-header-bar {
            padding: 12px 18px;
            background-color: #1a2332;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .modal-header-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Nút đóng hoàn toàn tách biệt, kích thước rõ ràng cho cảm ứng */
        .modal-close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
            font-size: 1.1rem;
        }

        .modal-close-btn:hover, .modal-close-btn:active {
            background: var(--accent-red);
            border-color: var(--accent-red);
            transform: scale(1.05);
        }

        /* Player Wrapper cho YouTube iFrame */
        .player-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000;
            position: relative;
            flex-shrink: 0;
        }

        .player-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-info-bar {
            padding: 14px 18px;
            background-color: var(--card-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
        }
    </style>
</head>

        <h1><i class="fa-solid fa-graduation-cap" style="color: var(--primary);"></i> Lộ Trình Học Video 30 Ngày</h1>

    <div class="days-grid" id="daysGrid"></div>

    <!-- Modal Chi Tiết Bài Học -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h2 id="modalTitle" style="font-size: 1.2rem;">Ngày 1 - Bài 1</h2>
                <button class="modal-close-btn" onclick="closeDetailModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p id="modalDesc" style="color: var(--text-muted); margin-bottom: 24px; line-height: 1.6; word-break: break-all; font-size: 0.9rem;">
                Link Video YouTube.
            </p>
            <div style="display: flex; justify-content: flex-end; gap: 12px;">
                <button class="btn btn-outline" onclick="closeDetailModal()">Đóng</button>
                <button class="btn" onclick="startLearning()"><i class="fa-solid fa-play"></i> Học ngay</button>
            </div>
        </div>
    </div>

    <!-- Modal Trình Phát Video YouTube -->
    <div class="modal-overlay" id="videoModal">
        <div class="modal-video-content">
            
            <!-- Thanh tiêu đề phía trên chứa nút đóng rời hẳn khỏi video -->
            <div class="modal-header-bar">
                <span class="modal-header-title" id="playerVideoTitle">Đang phát: Ngày 1 - Bài 1</span>
                <button class="modal-close-btn" onclick="closeVideoPlayer()" title="Đóng Video (Esc)">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <!-- Khung phát Video YouTube -->
            <div class="player-wrapper" id="playerWrapper">
                <iframe id="youtubePlayer" 
                        src="" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen" 
                        allowfullscreen>
                </iframe>
            </div>

            <!-- Thanh công cụ phía dưới video -->
            <div class="video-info-bar">
                <span class="status-badge"><i class="fa-brands fa-youtube"></i> YouTube Player</span>
                <button class="btn btn-outline" onclick="toggleFullScreen()" style="padding: 6px 12px; font-size: 0.85rem;">
                    <i class="fa-solid fa-expand"></i> Phóng to màn hình
                </button>
            </div>
        </div>
    </div>

        const DEFAULT_DEMO_YOUTUBE = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";

        // Trích xuất ID YouTube tương thích mọi chuẩn link
        function extractYouTubeId(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function getLessonsCountForDay(day) {
            if (day === 1 || day === 2) return 2;
            if (day === 3 || day === 4) return 3;
            return 4;
        }

        function renderDashboard() {
            const grid = document.getElementById('daysGrid');
            grid.innerHTML = '';

            for (let d = 1; d <= TOTAL_DAYS; d++) {
                const dayCard = document.createElement('div');
                dayCard.className = 'day-card active';

                const totalLessons = getLessonsCountForDay(d);
                let lessonsHTML = '';

                for (let v = 1; v <= totalLessons; v++) {
                    lessonsHTML += `
                        <div class="video-item unlocked" onclick="openLessonModal(${d}, ${v})">
                            <div class="video-title">
                                <span>Bài ${v}</span>
                                <i class="fa-brands fa-youtube" style="color: var(--accent-red);"></i>
                            </div>
                            <div class="video-status">Sẵn sàng</div>
                        </div>
                    `;
                }

                dayCard.innerHTML = `
                    <div class="day-header">
                        <span class="day-title">Ngày ${d}</span>
                        <span class="day-badge">${totalLessons} bài</span>
                    </div>
                    <div class="video-list">
                        ${lessonsHTML}
                    </div>
                `;
                grid.appendChild(dayCard);
            }
        }

        function openLessonModal(day, lesson) {
            currentSelectedLesson = { day, lesson };
            const key = `${day}_${lesson}`;
            const targetUrl = youtubeLinks[key] && youtubeLinks[key].trim() !== "" 
                              ? youtubeLinks[key] 
                              : DEFAULT_DEMO_YOUTUBE;

            document.getElementById('modalTitle').innerText = `Ngày ${day} - Bài ${lesson}`;
            document.getElementById('modalDesc').innerText = `Nguồn video: ${targetUrl}`;
            document.getElementById('detailModal').classList.add('active');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        function startLearning() {
            closeDetailModal();
            const { day, lesson } = currentSelectedLesson;
            
            document.getElementById('playerVideoTitle').innerText = `Ngày ${day} - Bài ${lesson}`;
            
            const key = `${day}_${lesson}`;
            const targetUrl = youtubeLinks[key] && youtubeLinks[key].trim() !== "" 
                              ? youtubeLinks[key] 
                              : DEFAULT_DEMO_YOUTUBE;
            const videoId = extractYouTubeId(targetUrl);

            const iframe = document.getElementById('youtubePlayer');
            if (videoId) {
                iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&fs=1`;
            } else {
                alert("Link YouTube cho bài này không hợp lệ!");
                return;
            }

            document.getElementById('videoModal').classList.add('active');
        }

        function closeVideoPlayer() {
            if (document.fullscreenElement) {
                document.exitFullscreen();
            }
            const iframe = document.getElementById('youtubePlayer');
            iframe.src = '';
            document.getElementById('videoModal').classList.remove('active');
        }

        // Bấm nền đen bên ngoài để đóng modal
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    closeDetailModal();
                    closeVideoPlayer();
                }
            });
        });

        // Bấm nút Esc trên bàn phím để đóng modal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeDetailModal();
                closeVideoPlayer();
            }
        });

        // Phóng to màn hình chuẩn đa trình duyệt
        function toggleFullScreen() {
            const playerElem = document.getElementById('playerWrapper');
            if (!document.fullscreenElement) {
                if (playerElem.requestFullscreen) {
                    playerElem.requestFullscreen();
                } else if (playerElem.webkitRequestFullscreen) {
                    playerElem.webkitRequestFullscreen();
                } else if (playerElem.msRequestFullscreen) {
                    playerElem.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        renderDashboard();
    </script>
</body>
</html>
