<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Học Video 30 Ngày (YouTube Player)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --accent-green: #10b981;
            --accent-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            padding: 24px;
        }

        header {
            max-width: 1400px;
            margin: 0 auto 32px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }

        .btn-outline:hover {
            background-color: var(--card-bg);
            color: var(--text-light);
        }

        .days-grid {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        @media (max-width: 1200px) {
            .days-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 900px) {
            .days-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .days-grid { grid-template-columns: 1fr; }
        }

        .day-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .day-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-light);
        }

        .day-badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            background-color: rgba(16, 185, 129, 0.2);
            color: var(--accent-green);
            font-weight: 600;
        }

        .video-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .video-item {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }

        .video-item.unlocked:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            background-color: rgba(79, 70, 229, 0.1);
        }

        .video-title {
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .video-status {
            font-size: 0.75rem;
            color: var(--accent-green);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: var(--card-bg);
            border-radius: 16px;
            width: 90%;
            max-width: 650px;
            padding: 24px;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .modal-video-content {
            background-color: #000;
            border-radius: 16px;
            width: 90%;
            max-width: 1000px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .player-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000;
            position: relative;
        }

        .player-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-info-bar {
            padding: 16px 20px;
            background-color: var(--card-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-graduation-cap" style="color: var(--primary);"></i> Lộ Trình Học Video 30 Ngày</h1>
    </header>

    <div class="days-grid" id="daysGrid"></div>

    <!-- Modal Chi Tiết Bài Học -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeDetailModal()"><i class="fa-solid fa-xmark"></i></button>
            <h2 id="modalTitle" style="margin-bottom: 12px;">Ngày 1 - Bài 1</h2>
            <p id="modalDesc" style="color: var(--text-muted); margin-bottom: 24px; line-height: 1.6; word-break: break-all;">
                Link Video YouTube.
            </p>
            <div style="display: flex; justify-content: flex-end; gap: 12px;">
                <button class="btn btn-outline" onclick="closeDetailModal()">Đóng</button>
                <button class="btn" onclick="startLearning()"><i class="fa-solid fa-play"></i> Học ngay</button>
            </div>
        </div>
    </div>

    <!-- Modal Trình Phát Video YouTube -->
    <div class="modal-overlay" id="videoModal">
        <div class="modal-video-content">
            <button class="modal-close" onclick="closeVideoPlayer()"><i class="fa-solid fa-xmark"></i></button>
            
            <div class="player-wrapper">
                <iframe id="youtubePlayer" 
                        src="" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                </iframe>
            </div>

            <div class="video-info-bar">
                <div>
                    <h3 id="playerVideoTitle" style="font-size: 1.1rem; margin-bottom: 4px;">Đang phát: Ngày 1 - Bài 1</h3>
                    <span class="status-badge"><i class="fa-brands fa-youtube"></i> YouTube Player</span>
                </div>
            </div>
        </div>
    </div>

        // Link phát thử mặc định nếu bài học đó bạn chưa dán link vào
        const DEFAULT_DEMO_YOUTUBE = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";

        // Trích xuất YouTube Video ID từ nhiều chuẩn link khác nhau
        function extractYouTubeId(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // Tính số lượng bài học theo ngày
        function getLessonsCountForDay(day) {
            if (day === 1 || day === 2) return 2;
            if (day === 3 || day === 4) return 3;
            return 4;
        }

        // Render giao diện 30 ngày
        function renderDashboard() {
            const grid = document.getElementById('daysGrid');
            grid.innerHTML = '';

            for (let d = 1; d <= TOTAL_DAYS; d++) {
                const dayCard = document.createElement('div');
                dayCard.className = 'day-card active';

                const totalLessons = getLessonsCountForDay(d);
                let lessonsHTML = '';

                for (let v = 1; v <= totalLessons; v++) {
                    lessonsHTML += `
                        <div class="video-item unlocked" onclick="openLessonModal(${d}, ${v})">
                            <div class="video-title">
                                <span>Bài ${v}</span>
                                <i class="fa-brands fa-youtube" style="color: var(--accent-red);"></i>
                            </div>
                            <div class="video-status">Sẵn sàng</div>
                        </div>
                    `;
                }

                dayCard.innerHTML = `
                    <div class="day-header">
                        <span class="day-title">Ngày ${d}</span>
                        <span class="day-badge">${totalLessons} bài</span>
                    </div>
                    <div class="video-list">
                        ${lessonsHTML}
                    </div>
                `;
                grid.appendChild(dayCard);
            }
        }

        // Mở popup thông tin
        function openLessonModal(day, lesson) {
            currentSelectedLesson = { day, lesson };
            const key = `${day}_${lesson}`;
            const targetUrl = youtubeLinks[key] && youtubeLinks[key].trim() !== "" 
                              ? youtubeLinks[key] 
                              : DEFAULT_DEMO_YOUTUBE;

            document.getElementById('modalTitle').innerText = `Ngày ${day} - Bài ${lesson}`;
            document.getElementById('modalDesc').innerText = `Nguồn video: ${targetUrl}`;
            document.getElementById('detailModal').classList.add('active');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        // Phát video
        function startLearning() {
            closeDetailModal();
            const { day, lesson } = currentSelectedLesson;
            
            document.getElementById('playerVideoTitle').innerText = `Đang phát: Ngày ${day} - Bài ${lesson}`;
            
            const key = `${day}_${lesson}`;
            const targetUrl = youtubeLinks[key] && youtubeLinks[key].trim() !== "" 
                              ? youtubeLinks[key] 
                              : DEFAULT_DEMO_YOUTUBE;
            const videoId = extractYouTubeId(targetUrl);

            const iframe = document.getElementById('youtubePlayer');
            if (videoId) {
                iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
            } else {
                alert("Link YouTube cho bài này không hợp lệ!");
                return;
            }

            document.getElementById('videoModal').classList.add('active');
        }

        // Đóng trình phát video
        function closeVideoPlayer() {
            const iframe = document.getElementById('youtubePlayer');
            iframe.src = '';
            document.getElementById('videoModal').classList.remove('active');
        }

        renderDashboard();
    </script>
</body>
</html>
